apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react { autolinkLibrariesWithApp() }

android {
    namespace 'com.glowble'
    compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
    defaultConfig { applicationId 'com.glowble'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0' }
}

dependencies { implementation('com.facebook.react:react-android'); if (hermesEnabled.toBoolean()) implementation('com.facebook.react:hermes-android') }
